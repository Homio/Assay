# ============================================================================
# track_p3b (P2 目标架构 · 阶段 3-4) — 页粒度流水线配置（唯一阈值源）
#
# 先例：eval/perf/config.yaml 是评测阈值唯一来源；本文件是 v2 管道全部
# 调度/预算/看门狗阈值的唯一来源。代码中不硬编码任何本书/页数数值；
# 算法阈值（GATEKEEPER_THRESHOLD=0.25、PAGE_ZOOM=2.0、YOLO conf 等）仍
# 以 assay 包内既有常量为准，本文件不重复定义以免双源漂移。
# ============================================================================

# CPU 工作池规模（默认值；pipeline.run(num_workers=...) 传入 >1 的显式值
# 时以传入值为准）。机器 20 核：17 worker + 1 调度器 + 1 GPU 服务 + 1 余量。
workers: 17

gpu_server:
  # 三通道动态批上限。SLANet 真批（engine batch_size）实测 27-crop 单次
  # run ≈7.3ms/crop（vs 逐张 22ms，bench_gpu_result.json）；PP-LCNet 批
  # 64 实测 4.7ms/批；YOLO 为 ultralytics 逐页 predict（无张量真批），
  # batch 上限仅控制单轮收集的请求数。
  slanet_batch_max: 32
  cls_batch_max: 64
  yolo_drain_max: 8          # 单轮最多排队的 YOLO 页请求（无真批，仅流控）
  # 每通道独立执行线程（track_p3b 终版）：窗口仅做零星请求的并发聚合
  yolo_window_ms: 0          # yolo 无真批，到即执行
  cls_window_ms: 3           # cls 单图 ~0.18ms，窗口只为聚合并发请求
  slanet_window_ms: 5        # slanet 跨页聚合凑批（engine batch_size 真批）
  slanet_lanes: 2            # track_p5/P31：slanet 通道执行 lane 数（每 lane 独立 ORT 会话，整日实测显存 +5~7GB/lane；1=原单线程行为）
  slow_batch_ms: 2000        # 单批超过该耗时打 WARN 日志
  # ── track_p5：合并调用通道（detect 任务 GPU 往返 5 跳 → 2 跳）────────
  # 总开关：false 时 worker 走 P3b 三通道路径，逐位不变（legacy 回退）。
  fused_calls: false
  # yolo2：一次往返携带 std + 条件 fb 双 pass。跨请求同 conf 合批
  # （ultralytics list source）经 2026-10-13 A/B 实测与逐页 predict
  # 存在像素级漂移（x 坐标 ~0.5-2.5px、conf ~0.004，根因：batch 统一
  # letterbox pad vs 单图 rect 最小 pad），超出 fp 抖动豁免范畴，
  # 故默认回退 false = 逐请求 predict，与旧调用序列逐次一致
  # （A/B 见 track_p5/ab_yolo_listbatch.py / ab_yolo.log）。
  yolo_list_batch: false
  yolo2_drain_max: 16        # YOLO GPU-bound平坦，大批量摊调用固定成本
  # cslanet：整批 crop 一次往返完成门控 + SLANet（服务端
  # 两路并行）；预处理/解码用线程池并行以提升
  # GPU 排队深度（CPU 解压）。
  cslanet_batch_max: 48      # slanet session 实测批48最优(2.83ms/crop，bench_slanet_fn_result)
  cslanet_prep_threads: 2    # 服务端 cls/slanet 预处理与解码线程池大小
  yolo2_window_ms: 25        # 与 yolo 同理：到即执行
  yolo2_pred_threads: 2      # std/fb 双组 predict 并行度（1=串行回退）
  cslanet_window_ms: 350     # track_p5: 凑满48窗口（到达率~40crops/s时批~35-48）
  exec_debug: false           # track_p5: 通道执行分解计时（诊断开关，默认 false）
  split_servers: true        # track_p5: GPU 服务拆分双进程（yolo | cls+slanet），默认 false 单服务回退
  # ── track_p5/P27：SLANet 解码器 torch CUDA Graph 化 ──
  # false = legacy 整图 ORT（含 Loop）；true = 编码器 ORT + 解码 Loop 由
  # torch 单步 CUDA Graph 逐步回放（全 FP32：TF32 非批不变会翻近平票 token；逐步判停与 ORT 同步），
  # 任何异常自动回退原 ORT 会话。
  slanet_torch_decoder: false
  slanet_decoder_slots: [32, 48]   # 预捕获的固定批尺寸（须 ≥ slanet/cslanet_batch_max）
  slanet_decoder_max_steps: 500    # 解码步上限 assign_0（Loop 步 0..500 含端点，至多 501 步）
  slanet_decoder_tf32: false     # 解码器 TF32（false=精密 FP32；true=对齐 ORT 默认 TF32 精度）
  # ── track_p5/P17 spike：worker 异步流水（detect 等待期任务窃取） ──
  # false = 未 armed 逐位 legacy；true 后 GPU 回包等待超 async_wait_ms
  # 即从共享任务队列窃取任务执行（text/build/calib 任意，detect 受
  # async_depth 每 worker 在途上限封顶；剩余超时预算 < async_guard_s
  # 不偷，防超时误杀）。
  async_pipeline: true
  async_depth: 4             # P31：配合 slanet_lanes=2 加深在途凑批（整日 d3 3511.9 / d4 3479.7s，差值在同码整日波动 3479.7–3566.4s 内，收益未证实；原值 2）
  async_wait_ms: 50
  async_guard_s: 10

scheduler:
  worker_store_mb: 64        # track_p5：worker MuPDF store 限额 MB（0=不改）；P25 A3 起真正接线
  worker_doc_cache_cap: 8    # P25 A3：worker fitz doc LRU 缓存槽位上限（原 16）
  calib_chunk_pages: 32      # 页眉校准扫描分片大小（页/任务）
  worker_seed_ug_span: true       # P29c：双下划线阈值随 calib 分片逐页采集、调度器合并后预置 worker（免每 worker 整本矢量重扫；false=原行为）
  worker_textpage_memo: true      # P29b：worker 内同一 Page 的 get_text("dict") 只抽一次（false=原行为）
  worker_textpage_memo_clip: false  # P30：同一 Page 同选项同 clip 的 get_text(dict/rawdict/text) 只抽一次（需 worker_textpage_memo；false=原行为）
  worker_seed_header_sigs: true   # P29：detect 任务用调度器已算的 header_sigs 预置 worker 校准缓存（免每 worker 整本重扫；false=原行为）
  a_floor_fraction: 0.25     # A 类（文本）在制保底占比（×worker 数）
  max_task_retries: 2        # 单任务失败重投上限（GPU 超时/瞬时错误）
  gpu_timeout_s: 60.0        # worker 单次 GPU 请求等待上限
  max_active_books: 50       # 同时开工的书上限（其余排队）
  max_active_pages: 1500     # P25 B1：活跃书总页数阀门（大书自然低并发；0=关闭）
  instance_lock_file: /tmp/assay_v2_pipeline.lock  # P25 A5：单实例 flock（勿放 NFS）

budgets:
  # 页预算调度器：在制页 ≤256、在制 crop ≤512、在制书 ≤50。
  max_inflight_pages: 256
  max_inflight_crops: 512
  est_crops_per_page: 2      # B 任务发派时的 crop 预估（完成后按实数校正）

watchdog:
  sample_interval_s: 1.0     # 采样 /proc/meminfo 与 loadavg 的周期
  # 内存水位（MiB，MemAvailable）：恒留 ~5GB 余量防 OOM。
  pause_mem_available_mib: 6144    # <6GB：暂停发新任务（在制继续排空）
  shrink_mem_available_mib: 5325    # <5.2GB：收缩活跃 worker 槽位
  resume_mem_available_mib: 6656    # >8GB 且持续 resume_sustain_s：恢复
  resume_sustain_s: 5.0
  min_active_workers: 8       # 收缩下限（保住流水线基本并发）
  loadavg_pause: 19.0        # load1 超过此值暂停扩槽（保 1 核余量）
  heartbeat_stale_s: 3.0     # GPU 服务心跳过期秒数 → 判定降级并重启
  startup_grace_s: 180.0     # GPU 服务启动（模型加载）期内心跳豁免时长
  probe_resume_s: 30.0       # P25 A1：pause 置位且在制清空持续该秒数 → 强制 clear 试发（防闩锁）
  stall_resume_s: 60.0       # P25 A1 加强：(pages,crops,done) 指纹停更超该秒数（搁浅在制）→ 同样强制 clear 试发
  latch_suspect_s: 120.0     # P25 A6：pause 持续超该秒数打 ERROR "latch suspected"
  status_interval_s: 60.0    # P25 A6：watchdog 周期状态行间隔
  release_on_pause: true     # P25 A2：worker 空转遇 pause 清 doc 缓存 + malloc_trim 主动降水位
